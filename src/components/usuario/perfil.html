<!-- [BUSCAR: AUTENTICACION USUARIO INTERFAZ] Vista protegida que permite revisar y editar el perfil del usuario autenticado. -->
<section class="user-shell">
  <a class="back-link" routerLink="/">Volver al restaurante</a>
  <div class="header-row">
    <div>
      <h1>Mi perfil</h1>
      <p *ngIf="profile()">Correo: {{ profile()?.correo }}</p>
    </div>
    <button class="secondary" (click)="logout()">Cerrar sesión</button>
  </div>

  <form (ngSubmit)="save()" [formGroup]="form" class="user-form">
    <!-- [BUSCAR: USUARIO] Nombre editable del perfil. -->
    <label>
      Nombre
      <input type="text" formControlName="nombre" />
    </label>

    <!-- [BUSCAR: CORREO USUARIO] Correo editable del perfil. -->
    <label>
      Correo
      <input type="email" formControlName="correo" />
    </label>

    <!-- [BUSCAR: AUTENTICACION] Cambio opcional de contrasena; se puede dejar vacio. -->
    <label>
      Nueva contraseña
      <input type="password" formControlName="password" placeholder="Dejar vacio para no cambiar" />
    </label>

    <!-- [BUSCAR: USUARIO] Guarda cambios y reporta si la actualizacion fue correcta. -->
    <button type="submit">Guardar cambios</button>
    <p class="success" *ngIf="successMessage()">{{ successMessage() }}</p>
    <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>
  </form>
</section>
