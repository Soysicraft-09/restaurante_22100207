<!-- [BUSCAR: PAGO PRODUCTO INTERFAZ] Tarjeta compacta de un platillo con imagen, metadatos, favoritos y acciones. -->
<article class="card">
  <!-- [BUSCAR: INTERFAZ] Si no hay imagen se muestra un placeholder para no romper la grilla visual. -->
  @if (item().imageUrl) {
    <img
      class="img"
      [src]="item().imageUrl"
      [alt]="item().name"
      width="320"
      height="260"
      loading="lazy"
    />
  } @else {
    <div class="img img-placeholder" aria-hidden="true">Sin imagen</div>
  }

  <div class="body">
    <!-- [BUSCAR: PAGO FAVORITOS INTERFAZ] Categoria + favorito, que son las dos acciones rapidas de la tarjeta. -->
    <div class="meta-row">
      <p class="tag">{{ item().category }}</p>
      <button
        class="fav-btn"
        type="button"
        [class.active]="isFavorite()"
        [attr.aria-label]="isFavorite() ? 'Quitar de favoritos' : 'Agregar a favoritos'"
        (click)="onToggleFavorite()"
      >
        @if (isFavorite()) {
          Favorito
        } @else {
          Guardar
        }
      </button>
    </div>

    <!-- [BUSCAR: PRODUCTO] Nombre y precio forman el encabezado comercial del producto. -->
    <div class="top">
      <h3 class="title">{{ item().name }}</h3>
      <span class="price">{{ item().price | currency: 'MXN' }}</span>
    </div>

    <!-- [BUSCAR: CARRITO] Descripcion corta y datos de maridaje/temporada para apoyar la compra. -->
    <p class="desc">{{ item().description }}</p>
    <p class="meta">Rareza: {{ item().pairing }}</p>
    <p class="season">Condicion: {{ item().season }}</p>

    <p class="stock" [class.stock-out]="!item().inStock">{{ availabilityText() }}</p>

    <!-- [BUSCAR: CARRITO] Acciones principales: abrir detalle o agregar al carrito. -->
    <div class="actions">
      <button
        class="ghost-btn"
        type="button"
        [attr.aria-label]="'Ver detalle de ' + item().name"
        (click)="onView()"
      >
        Ver detalle
      </button>

      @if (canBuy()) {
        <button
          class="add-btn"
          type="button"
          [disabled]="!item().inStock"
          [attr.aria-label]="'Agregar ' + item().name + ' al carrito'"
          (click)="onAdd()"
        >
          Agregar al carrito
        </button>
      } @else {
        <span class="stock">{{ blockedActionText() }}</span>
      }
    </div>
  </div>
</article>
