<!doctype html>
<!-- Documento HTML base. Angular inyecta aqui los bundles generados por el framework. -->
<html lang="es-MX">
<head>
  <!-- Metadatos base del documento principal servido por Angular. -->
  <meta charset="utf-8">
  <title>Casa Quetzal</title>
  <!-- base permite que el router de Angular resuelva rutas relativas desde la raiz. -->
  <base href="/">
  <!-- viewport hace que el sitio sea responsivo en celulares. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <!-- Angular monta toda la aplicacion dentro de este elemento raiz. -->
  <app-root></app-root>
</body>
</html>
